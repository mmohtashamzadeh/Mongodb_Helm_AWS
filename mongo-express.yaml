apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: mongo-demo
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: mongo-express-url
                  key: mongodb-url

            - name: ME_CONFIG_BASICAUTH
              value: "true"

            - name: ME_CONFIG_BASICAUTH_USERNAME
              value: admin

            - name: ME_CONFIG_BASICAUTH_PASSWORD
              value: "<mongo-express-ui-password>"

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
  namespace: mongo-demo
spec:
  type: ClusterIP
  selector:
    app: mongo-express
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: mongo-express-cluster
  region: eu-central-1
  version: "1.35"

iam:
  withOIDC: true

managedNodeGroups:
  - name: mongo-workers
    instanceType: t3.micro
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 20
    privateNetworking: false
